[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bounded-autonomy"
version = "0.1.0"
description = "Research scaffold for a zero-trust runtime control plane for agentic AI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Jodie Levy"}]
license = {text = "MIT"}
dependencies = []

[project.scripts]
bounded-autonomy = "bounded_autonomy.cli:main"

[tool.setuptools.packages.find]
include = ["bounded_autonomy*"]
